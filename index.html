<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystery Card: Es Teh di Kantin</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #1a1a1a;
            --text-muted: #595959;
            --primary: #0056b3;
            --primary-hover: #004494;
            --focus-ring: #ffc107;
            --border-color: #d1d5db;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            line-height: 1.6;
        }

        .card {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            border: 1px solid var(--border-color);
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
        }

        h1 {
            font-size: 1.2rem;
            color: var(--text-muted);
            letter-spacing: 2px;
            margin: 0 0 5px 0;
            text-transform: uppercase;
        }

        h2 {
            font-size: 1.1rem;
            color: var(--primary);
            margin: 0 0 15px 0;
        }

        h3 {
            font-size: 1.8rem;
            color: var(--text-main);
            margin: 0;
        }

        p.instruction {
            text-align: center;
            font-size: 1.05rem;
            margin-bottom: 20px;
        }

        .status-box {
            background-color: #e2e8f0;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 20px;
        }
        .status-box.error { background-color: #fee2e2; color: #991b1b; }
        .status-box.ready { background-color: #dcfce7; color: #166534; }

        .progress-section {
            margin-bottom: 25px;
        }

        .time-info {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 1rem;
            margin-bottom: 8px;
        }

        input[type="range"] {
            width: 100%;
            height: 24px;
            cursor: pointer;
        }

        .controls-main {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }

        .controls-secondary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .speed-control label {
            font-weight: bold;
            margin-right: 8px;
        }

        select {
            padding: 10px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        /* Focus styles for Accessibility */
        button:focus, 
        input[type="range"]:focus, 
        select:focus {
            outline: 4px solid var(--focus-ring);
            outline-offset: 2px;
        }
    </style>
</head>
<body>

    <main class="card">
        <header>
            <h1>Mystery Card</h1>
            <h2>HUKUM PERMINTAAN DAN PENAWARAN</h2>
            <h3>Kasus: Es Teh di Kantin</h3>
        </header>

        <p class="instruction">Tekan tombol Putar di bawah ini untuk mendengarkan pembacaan teks kasus.</p>

        <div id="status" class="status-box" role="status" aria-live="polite">
            Memuat file audio...
        </div>

        <!-- Audio Element (Hidden from visual, manipulated via JS) -->
        <audio id="audio-player" src="luvvoice.com-20261113-idaIQs.mp3" preload="metadata"></audio>

        <div class="progress-section">
            <div class="time-info" aria-hidden="true">
                <span id="current-time">00:00</span>
                <span id="duration-time">00:00</span>
            </div>
            <input type="range" id="progress-bar" value="0" min="0" step="1" 
                   aria-label="Geser untuk berpindah posisi audio. Waktu saat ini: 0 detik.">
        </div>

        <div class="controls-main">
            <button id="btn-play" aria-label="Putar Audio" disabled>
                <span aria-hidden="true">▶</span> Putar
            </button>
            <button id="btn-pause" aria-label="Jeda Audio" style="display: none;">
                <span aria-hidden="true">⏸</span> Jeda
            </button>
        </div>

        <div class="controls-secondary">
            <button id="btn-restart" aria-label="Ulangi audio dari awal" disabled>
                <span aria-hidden="true">⏮</span> Ulangi
            </button>
            
            <div class="speed-control">
                <label for="speed-select">Kecepatan:</label>
                <select id="speed-select" aria-label="Pilih kecepatan putar audio">
                    <option value="0.75">0.75x</option>
                    <option value="1" selected>1x (Normal)</option>
                    <option value="1.25">1.25x</option>
                    <option value="1.5">1.5x</option>
                    <option value="2">2x</option>
                </select>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const audio = document.getElementById('audio-player');
            const playBtn = document.getElementById('btn-play');
            const pauseBtn = document.getElementById('btn-pause');
            const restartBtn = document.getElementById('btn-restart');
            const progressBar = document.getElementById('progress-bar');
            const currentTimeEl = document.getElementById('current-time');
            const durationTimeEl = document.getElementById('duration-time');
            const speedSelect = document.getElementById('speed-select');
            const statusBox = document.getElementById('status');

            // Format time in MM:SS
            function formatTime(seconds) {
                if (isNaN(seconds)) return "00:00";
                const m = Math.floor(seconds / 60);
                const s = Math.floor(seconds % 60);
                return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            }

            // Audio Metadata Loaded
            audio.addEventListener('loadedmetadata', () => {
                durationTimeEl.textContent = formatTime(audio.duration);
                progressBar.max = Math.floor(audio.duration);
                
                statusBox.textContent = "Audio siap diputar.";
                statusBox.className = "status-box ready";
                
                playBtn.disabled = false;
                restartBtn.disabled = false;
            });

            // Handle Error
            audio.addEventListener('error', () => {
                statusBox.textContent = "Gagal memuat audio. Pastikan file 'luvvoice.com-20261113-idaIQs.mp3' berada di folder yang sama dengan file HTML ini.";
                statusBox.className = "status-box error";
            });

            // Time Update (Sync progress bar and text)
            audio.addEventListener('timeupdate', () => {
                const current = Math.floor(audio.currentTime);
                currentTimeEl.textContent = formatTime(current);
                progressBar.value = current;
                
                // Update ARIA label for screen readers
                progressBar.setAttribute('aria-valuenow', current);
                progressBar.setAttribute('aria-label', `Posisi audio: ${current} detik dari total ${Math.floor(audio.duration)} detik`);
            });

            // Audio Ended
            audio.addEventListener('ended', () => {
                playBtn.style.display = "flex";
                pauseBtn.style.display = "none";
                audio.currentTime = 0;
                playBtn.focus();
            });

            // Play Button
            playBtn.addEventListener('click', () => {
                audio.play().then(() => {
                    playBtn.style.display = "none";
                    pauseBtn.style.display = "flex";
                    pauseBtn.focus();
                    statusBox.textContent = "Audio sedang diputar.";
                }).catch(e => {
                    console.error("Gagal memutar audio:", e);
                });
            });

            // Pause Button
            pauseBtn.addEventListener('click', () => {
                audio.pause();
                pauseBtn.style.display = "none";
                playBtn.style.display = "flex";
                playBtn.focus();
                statusBox.textContent = "Audio dijeda.";
            });

            // Restart Button
            restartBtn.addEventListener('click', () => {
                audio.currentTime = 0;
                if (audio.paused) {
                    audio.play().then(() => {
                        playBtn.style.display = "none";
                        pauseBtn.style.display = "flex";
                    });
                }
                statusBox.textContent = "Audio diputar ulang dari awal.";
            });

            // Seek (Progress Bar)
            progressBar.addEventListener('input', () => {
                audio.currentTime = progressBar.value;
            });

            // Speed Control
            speedSelect.addEventListener('change', (e) => {
                audio.playbackRate = parseFloat(e.target.value);
                statusBox.textContent = `Kecepatan diubah menjadi ${e.target.value} kali.`;
            });
        });
    </script>
</body>
</html>
