<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <!-- Meta viewport wajib untuk Responsive Web Design (RWD) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Mystery Card: Es Teh di Kantin</title>
    <style>
        /* 
         * VARIABEL WARNA & UKURAN (High Contrast & RWD)
         */
        :root {
            --bg-color: #ffffff;
            --text-main: #000000;
            --text-muted: #222222;
            --primary: #0044cc;
            --primary-hover: #002266;
            --focus-ring: #000000;
            --border-color: #777777;
            --box-bg: #f5f5f5;
        }

        /* Tata letak dasar (Desktop/Global) */
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            /* Padding global agar card tidak menempel di ujung layar pada HP */
            padding: clamp(15px, 3vw, 20px); 
            box-sizing: border-box;
            line-height: 1.6;
        }

        /* 
         * WADAH UTAMA (CARD)
         * Menggunakan max-width agar tidak melebar berlebihan di Desktop,
         * namun menggunakan width 100% agar fleksibel di HP/Tablet.
         */
        .card {
            background-color: var(--bg-color);
            /* Padding responsif: kecil di HP, lebih lega di Desktop */
            padding: clamp(20px, 5vw, 40px);
            border-radius: 12px;
            width: 100%;
            max-width: 800px;
            border: 3px solid var(--border-color);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            box-sizing: border-box;
        }

        header {
            text-align: center;
            margin-bottom: clamp(20px, 4vw, 30px);
            padding-bottom: clamp(15px, 3vw, 20px);
            border-bottom: 3px solid var(--border-color);
        }

        /* Tipografi Responsif menggunakan clamp() (min, ideal, max) */
        h1 {
            font-size: clamp(1.75rem, 4vw + 1rem, 2.5rem);
            font-weight: 800;
            margin: 0 0 10px 0;
        }

        h2 {
            font-size: clamp(1.2rem, 3vw + 0.5rem, 1.5rem);
            font-weight: 700;
            color: var(--text-muted);
            margin: 0 0 15px 0;
        }

        h3 {
            font-size: clamp(1.5rem, 4vw + 0.8rem, 2.25rem);
            font-weight: 800;
            color: var(--primary);
            margin: 0;
        }

        p.instruction {
            text-align: center;
            font-size: clamp(1.1rem, 2vw + 0.5rem, 1.375rem);
            font-weight: 600;
            margin-bottom: clamp(20px, 4vw, 30px);
        }

        .status-box {
            background-color: var(--box-bg);
            padding: clamp(15px, 3vw, 20px);
            border-radius: 8px;
            font-size: clamp(1.1rem, 2vw + 0.5rem, 1.375rem);
            font-weight: 700;
            text-align: center;
            margin-bottom: clamp(20px, 4vw, 30px);
            border: 2px solid var(--border-color);
            word-wrap: break-word;
        }
        .status-box.error { background-color: #ffeeee; color: #aa0000; border-color: #aa0000; }
        .status-box.ready { background-color: #eeffee; color: #006600; border-color: #006600; }

        .progress-section {
            margin-bottom: clamp(25px, 5vw, 35px);
            width: 100%;
        }

        .time-info {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            font-size: clamp(1rem, 2vw + 0.4rem, 1.25rem);
            margin-bottom: 15px;
        }

        /* Progress Bar */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            background: transparent;
            cursor: pointer;
            box-sizing: border-box;
        }
        input[type="range"]::-webkit-slider-runnable-track {
            width: 100%;
            height: 16px;
            background: #cccccc;
            border-radius: 8px;
            border: 2px solid var(--text-main);
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 36px;
            width: 36px;
            border-radius: 50%;
            background: var(--text-main);
            margin-top: -12px;
            border: 4px solid var(--bg-color);
            box-shadow: 0 0 0 2px var(--text-main);
        }
        input[type="range"]::-moz-range-track {
            width: 100%;
            height: 16px;
            background: #cccccc;
            border-radius: 8px;
            border: 2px solid var(--text-main);
        }
        input[type="range"]::-moz-range-thumb {
            height: 36px;
            width: 36px;
            border-radius: 50%;
            background: var(--text-main);
            border: 4px solid var(--bg-color);
            box-shadow: 0 0 0 2px var(--text-main);
        }

        /* Kontrol Audio (Putar/Jeda) */
        .controls-main {
            display: flex;
            gap: clamp(15px, 3vw, 25px);
            margin-bottom: clamp(25px, 5vw, 35px);
            width: 100%;
        }

        button {
            background-color: var(--primary);
            color: #ffffff;
            border: 3px solid var(--primary);
            padding: clamp(15px, 3vw, 20px) clamp(20px, 4vw, 32px);
            font-size: clamp(1.2rem, 2.5vw + 0.5rem, 1.5rem);
            font-weight: 800;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.2s ease-in-out;
            width: 100%;
            box-sizing: border-box;
        }

        button:hover:not(:disabled) {
            background-color: var(--primary-hover);
            border-color: var(--primary-hover);
        }
        button:disabled {
            background-color: #777777;
            border-color: #777777;
            color: #eeeeee;
            cursor: not-allowed;
        }

        /* Kontrol Sekunder (Ulangi & Kecepatan) */
        .controls-secondary {
            display: flex;
            flex-wrap: wrap;
            gap: clamp(15px, 3vw, 25px);
            background: var(--box-bg);
            padding: clamp(15px, 4vw, 25px);
            border-radius: 12px;
            border: 2px solid var(--border-color);
            width: 100%;
            box-sizing: border-box;
        }

        /* Pengaturan agar tombol Ulangi tidak 100% di layar besar */
        .controls-secondary button {
            flex: 1 1 auto;
            width: auto;
        }

        .speed-control {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1 1 100%;
        }
        .speed-control label {
            font-size: clamp(1.1rem, 2vw + 0.5rem, 1.375rem);
            font-weight: 800;
        }
        select {
            width: 100%;
            padding: 15px;
            font-size: clamp(1.1rem, 2vw + 0.4rem, 1.25rem);
            font-weight: 700;
            color: var(--text-main);
            border-radius: 8px;
            border: 3px solid var(--border-color);
            background-color: #ffffff;
            cursor: pointer;
            box-sizing: border-box;
        }

        /* Fokus Keyboard */
        button:focus, 
        input[type="range"]:focus, 
        select:focus {
            outline: 5px solid var(--focus-ring);
            outline-offset: 4px;
            background-color: #ffffe0;
        }
        button:focus { color: #000000; }

        /* 
         * MEDIA QUERIES
         * Mengatur tata letak spesifik berdasarkan lebar layar
         */

        /* Untuk Tablet dan Desktop (Layar >= 600px) */
        @media (min-width: 600px) {
            .controls-main {
                justify-content: center;
            }
            .controls-main button {
                width: auto; /* Tombol menyesuaikan isi konten, tidak selebar layar */
                min-width: 200px;
            }
            .controls-secondary {
                justify-content: space-between;
                align-items: center;
            }
            .speed-control {
                flex-direction: row;
                align-items: center;
                flex: 0 1 auto;
                width: auto;
            }
            select {
                width: auto; /* Dropdown tidak memanjang 100% pada layar besar */
            }
        }

        /* Penyesuaian tata letak untuk HP sangat sempit (Layar <= 360px) */
        @media (max-width: 360px) {
            .controls-secondary button {
                width: 100%; /* Tombol ulangi mengambil baris penuh agar tidak terjepit */
            }
        }
    </style>
</head>
<body>

    <main class="card">
        <header>
            <h1>MYSTERY CARD</h1>
            <h2>HUKUM PERMINTAAN DAN PENAWARAN</h2>
            <h3>ES TEH DI KANTIN</h3>
        </header>

        <p class="instruction">Tekan tombol Putar di bawah ini untuk mendengarkan pembacaan teks kasus.</p>

        <div id="status" class="status-box" role="status" aria-live="assertive">
            Memuat file audio...
        </div>

        <audio id="audio-player" src="luvvoice.com-20261113-idaIQs.mp3" preload="metadata"></audio>

        <div class="progress-section">
            <div class="time-info" aria-hidden="true">
                <span id="current-time">00:00</span>
                <span id="duration-time">00:00</span>
            </div>
            <input type="range" id="progress-bar" value="0" min="0" step="1" 
                   aria-label="Geser untuk berpindah posisi audio. Waktu saat ini: 0 detik.">
        </div>

        <div class="controls-main">
            <button id="btn-play" aria-label="Putar Audio" disabled>
                <span aria-hidden="true">▶</span> PUTAR
            </button>
            <button id="btn-pause" aria-label="Jeda Audio" style="display: none;">
                <span aria-hidden="true">⏸</span> JEDA
            </button>
        </div>

        <div class="controls-secondary">
            <button id="btn-restart" aria-label="Ulangi audio dari awal" disabled>
                <span aria-hidden="true">⏮</span> ULANGI
            </button>
            
            <div class="speed-control">
                <label for="speed-select">Kecepatan:</label>
                <select id="speed-select" aria-label="Pilih kecepatan putar audio">
                    <option value="0.75">0.75x (Lambat)</option>
                    <option value="1" selected>1x (Normal)</option>
                    <option value="1.25">1.25x (Sedang)</option>
                    <option value="1.5">1.5x (Cepat)</option>
                    <option value="2">2x (Sangat Cepat)</option>
                </select>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const audio = document.getElementById('audio-player');
            const playBtn = document.getElementById('btn-play');
            const pauseBtn = document.getElementById('btn-pause');
            const restartBtn = document.getElementById('btn-restart');
            const progressBar = document.getElementById('progress-bar');
            const currentTimeEl = document.getElementById('current-time');
            const durationTimeEl = document.getElementById('duration-time');
            const speedSelect = document.getElementById('speed-select');
            const statusBox = document.getElementById('status');

            function formatTime(seconds) {
                if (isNaN(seconds)) return "00:00";
                const m = Math.floor(seconds / 60);
                const s = Math.floor(seconds % 60);
                return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            }

            audio.addEventListener('loadedmetadata', () => {
                durationTimeEl.textContent = formatTime(audio.duration);
                progressBar.max = Math.floor(audio.duration);
                statusBox.textContent = "Audio siap diputar.";
                statusBox.className = "status-box ready";
                playBtn.disabled = false;
                restartBtn.disabled = false;
            });

            audio.addEventListener('error', () => {
                statusBox.textContent = "Gagal memuat audio. Pastikan file 'luvvoice.com-20261113-idaIQs.mp3' berada di folder yang sama.";
                statusBox.className = "status-box error";
            });

            audio.addEventListener('timeupdate', () => {
                const current = Math.floor(audio.currentTime);
                currentTimeEl.textContent = formatTime(current);
                progressBar.value = current;
                progressBar.setAttribute('aria-valuenow', current);
                progressBar.setAttribute('aria-label', `Posisi audio: ${current} detik dari total ${Math.floor(audio.duration)} detik`);
            });

            audio.addEventListener('ended', () => {
                playBtn.style.display = "flex";
                pauseBtn.style.display = "none";
                audio.currentTime = 0;
                playBtn.focus();
                statusBox.textContent = "Pemutaran selesai.";
            });

            playBtn.addEventListener('click', () => {
                audio.play().then(() => {
                    playBtn.style.display = "none";
                    pauseBtn.style.display = "flex";
                    pauseBtn.focus();
                    statusBox.textContent = "Audio sedang diputar.";
                }).catch(e => {
                    console.error("Gagal memutar audio:", e);
                });
            });

            pauseBtn.addEventListener('click', () => {
                audio.pause();
                pauseBtn.style.display = "none";
                playBtn.style.display = "flex";
                playBtn.focus();
                statusBox.textContent = "Audio dijeda.";
            });

            restartBtn.addEventListener('click', () => {
                audio.currentTime = 0;
                if (audio.paused) {
                    audio.play().then(() => {
                        playBtn.style.display = "none";
                        pauseBtn.style.display = "flex";
                    });
                }
                statusBox.textContent = "Audio diputar ulang dari awal.";
            });

            progressBar.addEventListener('input', () => {
                audio.currentTime = progressBar.value;
            });

            speedSelect.addEventListener('change', (e) => {
                audio.playbackRate = parseFloat(e.target.value);
                const selectedText = e.target.options[e.target.selectedIndex].text;
                statusBox.textContent = `Kecepatan diubah menjadi ${selectedText}.`;
            });
        });
    </script>
</body>
</html>
