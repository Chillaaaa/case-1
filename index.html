<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystery Card: Es Teh di Kantin</title>
    <style>
        /* 
         * PENGATURAN UI UNTUK LOW VISION
         * Menggunakan palet kontras tinggi (WCAG 2.2 AA/AAA)
         * Ukuran basis diperbesar untuk keterbacaan maksimal
         */
        :root {
            --bg-color: #ffffff;         /* Latar belakang putih bersih */
            --text-main: #000000;        /* Teks utama hitam pekat */
            --text-muted: #222222;       /* Teks sekunder abu-abu sangat gelap */
            --primary: #0044cc;          /* Biru tua untuk elemen interaktif */
            --primary-hover: #002266;    /* Biru lebih gelap saat hover */
            --focus-ring: #000000;       /* Outline fokus hitam tegas */
            --border-color: #777777;     /* Garis pembatas kontras tinggi */
            --box-bg: #f5f5f5;           /* Latar kotak kontrol abu-abu terang */
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            line-height: 1.6;
        }

        .card {
            background-color: var(--bg-color);
            padding: 40px;
            border-radius: 12px;
            max-width: 800px;
            width: 100%;
            border: 3px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 3px solid var(--border-color);
        }

        h1 {
            font-size: 2.5rem; /* ~40px */
            font-weight: 800;
            color: var(--text-main);
            margin: 0 0 10px 0;
            text-transform: uppercase;
        }

        h2 {
            font-size: 1.5rem; /* ~24px */
            font-weight: 700;
            color: var(--text-muted);
            margin: 0 0 20px 0;
            text-transform: uppercase;
        }

        h3 {
            font-size: 2.25rem; /* ~36px */
            font-weight: 800;
            color: var(--primary);
            margin: 0;
        }

        p.instruction {
            text-align: center;
            font-size: 1.375rem; /* ~22px */
            font-weight: 600;
            margin-bottom: 30px;
            color: var(--text-main);
        }

        .status-box {
            background-color: var(--box-bg);
            padding: 20px;
            border-radius: 8px;
            font-size: 1.375rem; /* ~22px */
            font-weight: 700;
            text-align: center;
            margin-bottom: 30px;
            border: 2px solid var(--border-color);
        }
        .status-box.error { background-color: #ffeeee; color: #aa0000; border-color: #aa0000; }
        .status-box.ready { background-color: #eeffee; color: #006600; border-color: #006600; }

        .progress-section {
            margin-bottom: 35px;
        }

        .time-info {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            font-size: 1.25rem; /* 20px */
            margin-bottom: 15px;
            color: var(--text-main);
        }

        /* Styling Progress Bar lebih tebal & mudah digeser */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            background: transparent;
            cursor: pointer;
        }
        
        input[type="range"]::-webkit-slider-runnable-track {
            width: 100%;
            height: 16px;
            background: #cccccc;
            border-radius: 8px;
            border: 2px solid var(--text-main);
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 40px;
            width: 40px;
            border-radius: 50%;
            background: var(--text-main);
            margin-top: -14px;
            border: 4px solid var(--bg-color);
            box-shadow: 0 0 0 2px var(--text-main);
        }

        input[type="range"]::-moz-range-track {
            width: 100%;
            height: 16px;
            background: #cccccc;
            border-radius: 8px;
            border: 2px solid var(--text-main);
        }

        input[type="range"]::-moz-range-thumb {
            height: 40px;
            width: 40px;
            border-radius: 50%;
            background: var(--text-main);
            border: 4px solid var(--bg-color);
            box-shadow: 0 0 0 2px var(--text-main);
        }

        .controls-main {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }

        button {
            background-color: var(--primary);
            color: #ffffff;
            border: 3px solid var(--primary);
            padding: 20px 32px;
            font-size: 1.5rem; /* 24px */
            font-weight: 800;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s ease-in-out;
        }

        button:hover {
            background-color: var(--primary-hover);
            border-color: var(--primary-hover);
        }

        button:disabled {
            background-color: #777777;
            border-color: #777777;
            color: #eeeeee;
            cursor: not-allowed;
        }

        .controls-secondary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 25px;
            background: var(--box-bg);
            padding: 25px;
            border-radius: 12px;
            border: 2px solid var(--border-color);
        }

        .speed-control {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .speed-control label {
            font-size: 1.375rem; /* 22px */
            font-weight: 800;
            color: var(--text-main);
        }

        select {
            padding: 15px 20px;
            font-size: 1.25rem; /* 20px */
            font-weight: 700;
            color: var(--text-main);
            border-radius: 8px;
            border: 3px solid var(--border-color);
            background-color: #ffffff;
            cursor: pointer;
        }

        /* Focus styles for Accessibility & Keyboard Navigation */
        button:focus, 
        input[type="range"]:focus, 
        select:focus {
            outline: 5px solid var(--focus-ring);
            outline-offset: 4px;
            background-color: #ffffe0; /* Memberikan efek highlight ringan saat fokus */
        }
        
        button:focus {
            color: #000000;
        }
    </style>
</head>
<body>

    <main class="card">
        <header>
            <h1>MYSTERY CARD</h1>
            <h2>HUKUM PERMINTAAN DAN PENAWARAN</h2>
            <h3>ES TEH DI KANTIN</h3>
        </header>

        <p class="instruction">Tekan tombol Putar di bawah ini untuk mendengarkan pembacaan teks kasus.</p>

        <div id="status" class="status-box" role="status" aria-live="assertive">
            Memuat file audio...
        </div>

        <!-- Audio Element (Menggunakan file MP3 yang sama) -->
        <audio id="audio-player" src="luvvoice.com-20261113-idaIQs.mp3" preload="metadata"></audio>

        <div class="progress-section">
            <div class="time-info" aria-hidden="true">
                <span id="current-time">00:00</span>
                <span id="duration-time">00:00</span>
            </div>
            <!-- Progress Bar ditebalkan dan area sentuh diperbesar -->
            <input type="range" id="progress-bar" value="0" min="0" step="1" 
                   aria-label="Geser untuk berpindah posisi audio. Waktu saat ini: 0 detik.">
        </div>

        <div class="controls-main">
            <!-- Teks tombol diperbesar, kontras tinggi -->
            <button id="btn-play" aria-label="Putar Audio" disabled>
                <span aria-hidden="true">▶</span> PUTAR
            </button>
            <button id="btn-pause" aria-label="Jeda Audio" style="display: none;">
                <span aria-hidden="true">⏸</span> JEDA
            </button>
        </div>

        <div class="controls-secondary">
            <button id="btn-restart" aria-label="Ulangi audio dari awal" disabled>
                <span aria-hidden="true">⏮</span> ULANGI
            </button>
            
            <div class="speed-control">
                <label for="speed-select">Kecepatan:</label>
                <select id="speed-select" aria-label="Pilih kecepatan putar audio">
                    <option value="0.75">0.75x (Lambat)</option>
                    <option value="1" selected>1x (Normal)</option>
                    <option value="1.25">1.25x (Sedang)</option>
                    <option value="1.5">1.5x (Cepat)</option>
                    <option value="2">2x (Sangat Cepat)</option>
                </select>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const audio = document.getElementById('audio-player');
            const playBtn = document.getElementById('btn-play');
            const pauseBtn = document.getElementById('btn-pause');
            const restartBtn = document.getElementById('btn-restart');
            const progressBar = document.getElementById('progress-bar');
            const currentTimeEl = document.getElementById('current-time');
            const durationTimeEl = document.getElementById('duration-time');
            const speedSelect = document.getElementById('speed-select');
            const statusBox = document.getElementById('status');

            // Format waktu menjadi MM:SS
            function formatTime(seconds) {
                if (isNaN(seconds)) return "00:00";
                const m = Math.floor(seconds / 60);
                const s = Math.floor(seconds % 60);
                return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            }

            // Saat metadata audio berhasil dimuat
            audio.addEventListener('loadedmetadata', () => {
                durationTimeEl.textContent = formatTime(audio.duration);
                progressBar.max = Math.floor(audio.duration);
                
                statusBox.textContent = "Audio siap diputar.";
                statusBox.className = "status-box ready";
                
                playBtn.disabled = false;
                restartBtn.disabled = false;
            });

            // Saat audio gagal dimuat
            audio.addEventListener('error', () => {
                statusBox.textContent = "Gagal memuat audio. Pastikan file 'luvvoice.com-20261113-idaIQs.mp3' berada di folder yang sama.";
                statusBox.className = "status-box error";
            });

            // Perbarui indikator waktu dan progress bar
            audio.addEventListener('timeupdate', () => {
                const current = Math.floor(audio.currentTime);
                currentTimeEl.textContent = formatTime(current);
                progressBar.value = current;
                
                // Perbarui label pembaca layar
                progressBar.setAttribute('aria-valuenow', current);
                progressBar.setAttribute('aria-label', `Posisi audio: ${current} detik dari total ${Math.floor(audio.duration)} detik`);
            });

            // Saat audio selesai
            audio.addEventListener('ended', () => {
                playBtn.style.display = "flex";
                pauseBtn.style.display = "none";
                audio.currentTime = 0;
                playBtn.focus();
                statusBox.textContent = "Pemutaran selesai.";
            });

            // Tombol Putar
            playBtn.addEventListener('click', () => {
                audio.play().then(() => {
                    playBtn.style.display = "none";
                    pauseBtn.style.display = "flex";
                    pauseBtn.focus();
                    statusBox.textContent = "Audio sedang diputar.";
                }).catch(e => {
                    console.error("Gagal memutar audio:", e);
                });
            });

            // Tombol Jeda
            pauseBtn.addEventListener('click', () => {
                audio.pause();
                pauseBtn.style.display = "none";
                playBtn.style.display = "flex";
                playBtn.focus();
                statusBox.textContent = "Audio dijeda.";
            });

            // Tombol Ulangi
            restartBtn.addEventListener('click', () => {
                audio.currentTime = 0;
                if (audio.paused) {
                    audio.play().then(() => {
                        playBtn.style.display = "none";
                        pauseBtn.style.display = "flex";
                    });
                }
                statusBox.textContent = "Audio diputar ulang dari awal.";
            });

            // Progress Bar Digeser
            progressBar.addEventListener('input', () => {
                audio.currentTime = progressBar.value;
            });

            // Pengaturan Kecepatan
            speedSelect.addEventListener('change', (e) => {
                audio.playbackRate = parseFloat(e.target.value);
                const selectedText = e.target.options[e.target.selectedIndex].text;
                statusBox.textContent = `Kecepatan diubah menjadi ${selectedText}.`;
            });
        });
    </script>
</body>
</html>
